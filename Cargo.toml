[package]
name = "mr-support"
version = "0.1.0"
edition = "2021"
description = "Mr. Support — AI support, human in control. Open-source Rust remote support with multi-agent swarm."
license = "AGPL-3.0-or-later"
repository = "https://github.com/miitreev90/mr-support"

[features]
gui = ["dep:egui", "dep:eframe", "dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { version = "0.31", optional = true }
eframe = { version = "0.31", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }

[workspace]
members = []
